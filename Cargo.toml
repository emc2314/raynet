[workspace]
members = [
    "crates/raynet-core",
    "crates/raynet-shell",
    "crates/raynet-shell-plugins",
    "crates/raynet-test-shell",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
aegis = "0.9.12"
arc-swap = "1.9.2"
atomic_float = "1.1.0"
bitcode = "0.6.9"
blake3 = "1.8.5"
byte_string = "1.0.0"
bytes = "1.12.1"
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.11"
futures = "0.3.32"
futures-util = "0.3.32"
log = { version = "0.4", features = [
    "max_level_debug",
    "release_max_level_info",
] }
mimalloc = "0.1.52"
rand = "0.10.2"
serde = { version = "1.0.209", features = ["derive"] }
spin = "0.12.1"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
panic = "abort"
